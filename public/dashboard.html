<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - ABC Hospital</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">
    <div class="logo">🏥 ABC Hospital Dashboard</div>
    <div style="display: flex; gap: 10px; align-items: center;">
        <span id="user-name" style="font-weight: bold;"></span>
        <button class="logout-btn" onclick="logout()" style="padding: 8px 16px; font-size: 14px;">Logout</button>
    </div>
</div>

<div class="dashboard">
    <div class="profile">
        <div class="profile-info">
            <h1>Welcome back!</h1>
            <p>Your appointments and medical records.</p>
        </div>
    </div>

    <h2>Upcoming Appointments</h2>
    <div class="appointments">
        <div class="app-card">
            <h3>Dental Checkup</h3>
            <p>Dr. Smith - Tomorrow 10:00 AM</p>
            <button>Reschedule</button>
        </div>
        <div class="app-card">
            <h3>Blood Test</h3>
            <p>Lab - Friday 2:00 PM</p>
            <button>View Details</button>
        </div>
    </div>

    <div style="display: flex; gap: 20px; margin-top: 40px;">
        <button class="primary-btn" onclick="window.location.href='/book-appointment.html'">Book Appointment</button>
        <button class="primary-btn" onclick="window.location.href='/medical-records.html'">Medical Records</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
